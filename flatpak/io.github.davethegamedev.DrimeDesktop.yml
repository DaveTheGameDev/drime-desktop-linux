# Flatpak manifest: `make flatpak` builds it into build/flatpak/drime-desktop-<version>.flatpak,
# the release workflow attaches that bundle to the GitHub Release. Not on Flathub: the
# org.freedesktop.Flatpak talk-name below would need a Flathub exception (see docs/flatpak-plan.md).
app-id: io.github.davethegamedev.DrimeDesktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: drime-desktop
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio                        # media previews in the web app
  - --filesystem=~/Drime:create                # the virtual drive
  - --filesystem=~/DrimeSync:create            # the sync folder
  - --filesystem=xdg-download                  # web app downloads
  - --filesystem=xdg-config/gtk-3.0:create     # the Files sidebar bookmark (~/.config/gtk-3.0/bookmarks)
  - --system-talk-name=org.freedesktop.login1  # wake-from-sleep recovery (web.py on_wake)
  - --talk-name=org.freedesktop.Flatpak        # host fusermount3 through /app/bin/fusermount3 (the drive)
  - --talk-name=org.gtk.vfs.*                  # gio set metadata::custom-icon on ~/Drime
  - --env=PYTHONPATH=/app/lib/drime-desktop
modules:
  - name: rclone
    # The official prebuilt binary, the same one rclone.org distributes.
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        url: https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip
        sha256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-arm64.zip
        sha256: 03f2504174034b6d004152ed7369251c9a9ec1f7e0836eda420f5c7a5ec0dff9
        only-arches: [aarch64]

  - name: fusermount-wrapper
    # FUSE mounts are impossible inside the sandbox; rclone execs this wrapper as fusermount3,
    # which forwards the FUSE fd to the host's fusermount3 (the Deja Dup / Pika Backup pattern).
    buildsystem: simple
    build-commands:
      - install -Dm755 fusermount-wrapper.sh /app/bin/fusermount3
    sources:
      - type: file
        path: fusermount-wrapper.sh

  - name: drime-desktop
    buildsystem: simple
    build-commands:
      - sh flatpak/build-app.sh /app
    sources:
      - type: dir
        path: ..
        skip: [build, .flatpak-builder, .git]
