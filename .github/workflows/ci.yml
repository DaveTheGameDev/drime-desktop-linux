name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-pytest python3-gi
      - name: Test
        run: make test
